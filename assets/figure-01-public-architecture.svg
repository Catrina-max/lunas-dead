<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d">
<title id="t">Luna's Dead public architecture</title><desc id="d">Diagram showing the story world connecting to game, series, visual art, gallery and physical objects, grounded by Hoffman and Olea inspired research systems.</desc>
<style>
